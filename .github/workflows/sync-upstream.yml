name: Upstream Sync and Cloudflare Pages Deploy

on:
  schedule:
    # Daily at 08:27 Beijing time (UTC+8).
    - cron: "27 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: misub-upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Safely merge upstream main
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git and upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/imzyb/MiSub.git
          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Merge upstream without overwriting fork changes
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard origin/main

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          if [ "$ORIGIN_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fork is already synchronized with upstream."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            git merge --abort || true
            echo "::error title=Upstream merge conflict::Automatic synchronization stopped without overwriting fork changes. Resolve the conflict manually."
            exit 1
          fi

          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Upstream changes were merged and pushed."

  build:
    name: Build MiSub once
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: npm ci --include=dev --registry=https://registry.npmjs.org/ --replace-registry-host=always

      - name: Build MiSub
        run: npm run build

      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: misub-pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy_pages:
    name: Deploy Pages ${{ matrix.target }}
    needs:
      - sync
      - build
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        target:
          - cf-1
          - cf-2
          - cf-3

    steps:
      - name: Checkout updated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Pages build artifact
        uses: actions/download-artifact@v4
        with:
          name: misub-pages-dist
          path: dist

      - name: Validate Cloudflare secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MISUB_KV_NAMESPACE_ID: ${{ secrets.MISUB_KV_NAMESPACE_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN in environment ${{ matrix.target }}"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID in environment ${{ matrix.target }}"; exit 1; }
          test -n "$MISUB_KV_NAMESPACE_ID" || { echo "Missing MISUB_KV_NAMESPACE_ID in environment ${{ matrix.target }}"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing ADMIN_PASSWORD in environment ${{ matrix.target }}"; exit 1; }
          [[ "$MISUB_KV_NAMESPACE_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo "MISUB_KV_NAMESPACE_ID must be a 32-character hexadecimal namespace ID"; exit 1; }

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          base = f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          }

          def request(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      body = json.load(error)
                  except Exception:
                      body = {"errors": [{"message": str(error)}]}
                  return error.code, body

          status, body = request("GET", f"{base}/misub")
          if status == 404:
              status, body = request(
                  "POST",
                  base,
                  {"name": "misub", "production_branch": "main"},
              )
              if status not in (200, 201):
                  raise SystemExit(
                      "Unable to create Pages project: "
                      + json.dumps(body.get("errors", body))
                  )
              print("Pages project misub was created")
          elif status == 200:
              print("Pages project misub already exists")
          else:
              raise SystemExit(
                  "Unable to check Pages project: "
                  + json.dumps(body.get("errors", body))
              )
          PY

      - name: Prepare Pages config and KV binding
        shell: bash
        env:
          MISUB_KV_NAMESPACE_ID: ${{ secrets.MISUB_KV_NAMESPACE_ID }}
        run: |
          cp wrangler-cf-pages.toml wrangler.toml
          printf '\n[[kv_namespaces]]\nbinding = "MISUB_KV"\nid = "%s"\n' "$MISUB_KV_NAMESPACE_ID" >> wrangler.toml

      - name: Configure ADMIN_PASSWORD secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler pages secret put ADMIN_PASSWORD --project-name=misub

      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=misub --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
